<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">
    <title>Suraksha - Login</title>
    <!-- CSS reference using Flask's url_for -->
    <link rel="stylesheet" href="/static/index.css">
    <!-- Add Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <!-- Firebase config reference -->
    <script src="/static/firebase-config.js"></script>
</head>

<body>
    <div class="login-container">
        <h1>🌤️ Suraksha</h1>
        <p>Weather Dashboard & News</p>
        <p>Please sign in to continue</p>
        <button id="googleSignIn" class="google-btn">
            <span id="buttonText">Sign in with Google</span>
            <div id="spinner" class="spinner hidden"></div>
        </button>
        
        <!-- Alternative access without authentication -->
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
            <p style="font-size: 14px; color: #666;">Or access without signing in:</p>
            <a href="/dashboard" style="color: #4285F4; text-decoration: none;">Go to Dashboard</a> | 
            <a href="/news" style="color: #4285F4; text-decoration: none;">Search News</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if Firebase is loaded
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not loaded, authentication disabled');
                return;
            }

            const auth = firebase.auth();
            const googleBtn = document.getElementById('googleSignIn');
            const buttonText = document.getElementById('buttonText');
            const spinner = document.getElementById('spinner');

            // Check if user is already logged in
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // User is already logged in, redirect to dashboard
                    window.location.href = "/dashboard";
                }
            });

            // Google Sign-In handler
            googleBtn.addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();

                // Show loading state
                buttonText.textContent = 'Signing in...';
                spinner.classList.remove('hidden');
                googleBtn.disabled = true;

                auth.signInWithPopup(provider)
                    .then((result) => {
                        // Successful login, check permissions
                        requestLocationAndNotifications();
                    })
                    .catch((error) => {
                        console.error('Error:', error);
                        buttonText.textContent = 'Sign in with Google';
                        spinner.classList.add('hidden');
                        googleBtn.disabled = false;

                        if (error.code === 'auth/popup-closed-by-user') {
                            alert('Sign in was canceled. Please try again.');
                        } else {
                            alert(`Sign in failed: ${error.message}`);
                        }
                    });
            });

            function requestLocationAndNotifications() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        () => {
                            // Location granted, request notifications
                            requestNotificationPermission();
                        },
                        (error) => {
                            // Location denied - still allow access but show warning
                            console.warn('Location access denied:', error);
                            requestNotificationPermission();
                        },
                        { enableHighAccuracy: true }
                    );
                } else {
                    console.warn('Geolocation not supported');
                    requestNotificationPermission();
                }
            }

            function requestNotificationPermission() {
                if ('Notification' in window) {
                    Notification.requestPermission().finally(() => {
                        // Redirect to dashboard
                        window.location.href = "/dashboard";
                    });
                } else {
                    window.location.href = "/dashboard";
                }
            }
        });
    </script>
</body>
</html>
