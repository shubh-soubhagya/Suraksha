<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">
    <title>Suraksha - Weather Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="static/firebase-config.js"></script>
    <style>
        /* News Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .news-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .news-source {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .news-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
        }

        .news-card a {
            color: #3498db;
            text-decoration: none;
        }

        .news-card a:hover {
            text-decoration: underline;
        }

        .news-description {
            color: #555;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .read-more {
            font-size: 0.8em;
            color: #3498db;
        }

        .search-container {
            display: flex;
            margin: 20px 0;
        }

        .search-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
        }

        .search-container button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .search-container button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🌤️ Suraksha Weather Dashboard</h1>
        <div class="location-display" id="locationInfo">
            <span>📍</span>
            <span id="locationCoordinates">Detecting your location...</span>
        </div>
        <div>
            <button id="newsBtn" class="news-btn">📰 News</button>
            <button id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
            <button id="signOutBtn" class="sign-out-btn">Sign Out</button>
        </div>
    </div>

    <div class="container">
        <div class="loading" id="loading">Loading weather data...</div>
        <div class="error" id="error"></div>
        <div class="chart-loading" id="chartLoading">
            <div class="spinner"></div>
            <p>Updating charts...</p>
        </div>

        <div class="filter-controls" id="controls">
            <div class="filter-group">
                <label for="dateRange">Date Range:</label>
                <select id="dateRange">
                    <option value="all">All Data</option>
                    <option value="7">Last 7 Days</option>
                    <option value="30">Last 30 Days</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sampleRate">Sample Rate:</label>
                <select id="sampleRate">
                    <option value="1">Every Point</option>
                    <option value="6">Every 6 Hours</option>
                    <option value="24">Daily</option>
                </select>
            </div>
        </div>

        <div class="stats-summary" id="stats"></div>
        <div class="charts-grid" id="charts"></div>
    </div>

    <!-- News Modal -->
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Weather News</h2>
            <div class="search-container">
                <input type="text" id="newsCity" placeholder="Enter a city name">
                <button id="searchNewsBtn">Search</button>
            </div>
            <div id="newsResults" class="news-container"></div>
        </div>
    </div>

    <script>
        // Global variables
        let fullWeatherData = []; // Stores all loaded weather data
        let filteredWeatherData = []; // Stores currently filtered data
        let charts = [];
        let userLocation = null;
        let notificationPermission = false;

        // Firebase Authentication State
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                verifyLocationAccess().then(() => {
                    loadWeatherData().catch(error => {
                        console.error('Failed to load data:', error);
                        showError(`Failed to load data: ${error.message}`);
                    });
                }).catch(error => {
                    console.error('Location access error:', error);
                    showError('Location access is required for this application. Please enable location services and refresh.');
                });
            }
        });

        // Verify location access
        function verifyLocationAccess() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            userLocation = {
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy
                            };
                            updateLocationInfo();
                            requestNotificationPermission().then(resolve).catch(resolve);
                        },
                        (error) => {
                            reject(new Error('Location access denied'));
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                } else {
                    reject(new Error('Geolocation not supported'));
                }
            });
        }

        // Update location information display
        function updateLocationInfo() {
            if (userLocation) {
                const locationElement = document.getElementById('locationInfo');
                locationElement.textContent = `Location: ${userLocation.latitude.toFixed(4)}, ${userLocation.longitude.toFixed(4)}`;
                locationElement.title = `Accuracy: ±${userLocation.accuracy.toFixed(0)} meters`;
            }
        }

        // Request notification permission
        function requestNotificationPermission() {
            return new Promise((resolve) => {
                if ('Notification' in window) {
                    if (Notification.permission === 'granted') {
                        notificationPermission = true;
                        showWelcomeNotification();
                        resolve();
                    } else if (Notification.permission !== 'denied') {
                        Notification.requestPermission().then(permission => {
                            notificationPermission = permission === 'granted';
                            if (notificationPermission) {
                                showWelcomeNotification();
                            }
                            resolve();
                        });
                    } else {
                        resolve();
                    }
                } else {
                    resolve();
                }
            });
        }

        // Show welcome notification
        function showWelcomeNotification() {
            if (notificationPermission) {
                new Notification('Welcome to Suraksha Dashboard', {
                    body: 'You will receive important weather alerts for your location',
                    icon: 'https://img.icons8.com/color/48/000000/cloud.png'
                });
            }
        }

        // Setup weather alerts
        function setupWeatherAlerts() {
            if (!notificationPermission) return;

            // Check for extreme temperature
            const extremeTemp = filteredWeatherData.find(data => data.temperature_2m > 35 || data.temperature_2m < 0);
            if (extremeTemp) {
                const tempType = extremeTemp.temperature_2m > 35 ? 'high' : 'low';
                new Notification(`Extreme Temperature Alert`, {
                    body: `${tempType === 'high' ? 'High' : 'Low'} temperature (${extremeTemp.temperature_2m}°C) detected in your area`,
                    icon: tempType === 'high' ?
                        'https://img.icons8.com/color/48/000000/hot.png' :
                        'https://img.icons8.com/color/48/000000/snow.png'
                });
            }

            // Check for precipitation
            const precipitation = filteredWeatherData.find(data => data.precipitation > 10);
            if (precipitation) {
                new Notification('Heavy Precipitation Alert', {
                    body: `Heavy precipitation (${precipitation.precipitation}mm) expected in your area`,
                    icon: 'https://img.icons8.com/color/48/000000/rain.png'
                });
            }

            // Check for strong winds
            const strongWind = filteredWeatherData.find(data => data.wind_speed_10m > 10);
            if (strongWind) {
                new Notification('Strong Wind Alert', {
                    body: `Strong winds (${strongWind.wind_speed_10m}m/s) expected in your area`,
                    icon: 'https://img.icons8.com/color/48/000000/wind.png'
                });
            }
        }

        // Color schemes for different chart groups
        const colorSchemes = {
            wind_speed: ['#3498db', '#2980b9', '#1abc9c', '#16a085'],
            wind_direction: ['#e74c3c', '#c0392b', '#f39c12', '#d35400'],
            cloud_cover: ['#9b59b6', '#8e44ad', '#6c5ce7', '#a55eea'],
            pressure: ['#27ae60', '#229954', '#58d68d', '#52c41a'],
            temperature: ['#ff6b6b', '#ee5a6f', '#ff9ff3', '#feca57'],
            humidity: ['#54a0ff', '#2e86de', '#0abde3', '#006ba6'],
            precipitation: ['#5f27cd', '#341f97', '#00d2d3', '#ff9ff3'],
            default: ['#3498db', '#e74c3c', '#f39c12', '#27ae60', '#9b59b6', '#1abc9c']
        };

        // Define chart groups with their columns and configurations
        const chartGroups = {
            'Temperature Metrics': {
                columns: ['temperature_2m', 'apparent_temperature', 'dew_point_2m'],
                type: 'line',
                colors: colorSchemes.temperature,
                unit: '°C'
            },
            'Wind Speed at Different Heights': {
                columns: ['wind_speed_10m', 'wind_speed_80m', 'wind_speed_120m', 'wind_speed_180m'],
                type: 'line',
                colors: colorSchemes.wind_speed,
                unit: 'm/s'
            },
            'Wind Direction at Different Heights': {
                columns: ['wind_direction_10m', 'wind_direction_80m', 'wind_direction_120m', 'wind_direction_180m'],
                type: 'line',
                colors: colorSchemes.wind_direction,
                unit: '°'
            },
            'Cloud Cover Levels': {
                columns: ['cloud_cover', 'cloud_cover_low', 'cloud_cover_mid', 'cloud_cover_high'],
                type: 'line',
                colors: colorSchemes.cloud_cover,
                unit: '%'
            },
            'Pressure Measurements': {
                columns: ['pressure_msl', 'surface_pressure'],
                type: 'line',
                colors: colorSchemes.pressure,
                unit: 'hPa'
            },
            'Humidity & Precipitation Probability': {
                columns: ['relative_humidity_2m', 'precipitation_probability'],
                type: 'line',
                colors: colorSchemes.humidity,
                unit: '%'
            },
            'Precipitation & Rain': {
                columns: ['precipitation', 'rain', 'showers', 'snowfall'],
                type: 'bar',
                colors: colorSchemes.precipitation,
                unit: 'mm'
            },
            'Wind Conditions': {
                columns: ['wind_speed_10m', 'wind_gusts_10m'],
                type: 'line',
                colors: colorSchemes.wind_speed,
                unit: 'm/s'
            }
        };

        // UI Helper Functions
        function showLoading(show, message = '') {
            const loadingEl = document.getElementById('loading');
            if (show) {
                loadingEl.style.display = 'block';
                if (message) loadingEl.textContent = message;
            } else {
                loadingEl.style.display = 'none';
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            showLoading(false);
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function showChartLoading(show) {
            document.getElementById('chartLoading').style.display = show ? 'flex' : 'none';
        }

        // Data Loading and Processing
        async function loadWeatherData() {
            try {
                showLoading(true, 'Loading weather data...');
                hideError();

                // Fetch data from Flask backend
                const response = await fetch('/api/weather');
                if (!response.ok) {
                    throw new Error(`Failed to load data: HTTP ${response.status}`);
                }

                const weatherData = await response.json();

                // Process the data to match expected format
                fullWeatherData = weatherData.map(item => {
                    // Convert temperature from Kelvin to Celsius if needed
                    const temp = item.temperature_2m;
                    return {
                        ...item,
                        date: item.date,
                        temperature_2m: typeof temp === 'number' ? temp : parseFloat(temp)
                    };
                });

                if (parsed.errors.length > 0) {
                    console.warn('CSV parsing warnings:', parsed.errors);
                }

                fullWeatherData.sort((a, b) => new Date(a.date) - new Date(b.date));

                // Apply initial filtering
                applyDateFilter();

                document.getElementById('controls').style.display = 'flex';
                document.getElementById('stats').style.display = 'grid';
                showLoading(false);

                displayStats();
                createAllCharts();

                if (notificationPermission) {
                    setupWeatherAlerts();
                }

            } catch (error) {
                console.error('Error loading weather data:', error);
                showError(`Error loading data: ${error.message}`);
            }
        }

        // Apply date filter based on selected range
        function applyDateFilter() {
            const dateRange = document.getElementById('dateRange').value;

            if (dateRange === 'all') {
                filteredWeatherData = [...fullWeatherData];
                return;
            }

            const days = parseInt(dateRange);
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(endDate.getDate() - days);

            // Set time components to ensure we get full days
            startDate.setHours(0, 0, 0, 0);
            endDate.setHours(23, 59, 59, 999);

            filteredWeatherData = fullWeatherData.filter(row => {
                const rowDate = new Date(row.date);
                return rowDate >= startDate && rowDate <= endDate;
            });

            // Update the date range display
            updateDateRangeDisplay(startDate, endDate);
        }

        function updateDateRangeDisplay(startDate, endDate) {
            const dateRangeElement = document.querySelector('.date-range-display');
            if (!dateRangeElement) return;

            const formatDate = (date) => {
                return date.toLocaleDateString('en-US', {
                    month: 'numeric',
                    day: 'numeric',
                    year: 'numeric'
                });
            };

            dateRangeElement.textContent = `${formatDate(startDate)} - ${formatDate(endDate)}`;
        }

        // Get data with both date and sample rate filters applied
        function getFilteredData() {
            const sampleRate = parseInt(document.getElementById('sampleRate').value);

            if (sampleRate === 1) {
                return [...filteredWeatherData];
            }

            return filteredWeatherData.filter((_, index) => index % sampleRate === 0);
        }

        function displayStats() {
            const data = getFilteredData();
            const totalRecords = data.length;
            const dateRangeText = document.querySelector('.date-range-display')?.textContent || getDateRange(data);
            const avgTemp = calculateAverage('temperature_2m', data);
            const maxWind = calculateMax('wind_speed_10m', data);
            const totalPrecip = calculateSum('precipitation', data);
            const avgHumidity = calculateAverage('relative_humidity_2m', data);

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalRecords}</div>
                    <div class="stat-label">Total Records</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${dateRangeText}</div>
                    <div class="stat-label">Date Range</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${avgTemp.toFixed(1)}°C</div>
                    <div class="stat-label">Avg Temperature</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${maxWind.toFixed(1)} m/s</div>
                    <div class="stat-label">Max Wind Speed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${totalPrecip.toFixed(1)} mm</div>
                    <div class="stat-label">Total Precipitation</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${avgHumidity.toFixed(1)}%</div>
                    <div class="stat-label">Avg Humidity</div>
                </div>
            `;
        }

        function getDateRange(data) {
            if (data.length === 0) return 'No data';
            const dates = data.map(row => new Date(row.date));
            const startDate = new Date(Math.min(...dates));
            const endDate = new Date(Math.max(...dates));

            return `${startDate.toLocaleDateString()} - ${endDate.toLocaleDateString()}`;
        }

        function calculateAverage(column, data = filteredWeatherData) {
            const values = getValidValues(column, data);
            return values.length > 0 ? values.reduce((a, b) => a + b, 0) / values.length : 0;
        }

        function calculateMax(column, data = filteredWeatherData) {
            const values = getValidValues(column, data);
            return values.length > 0 ? Math.max(...values) : 0;
        }

        function calculateSum(column, data = filteredWeatherData) {
            const values = getValidValues(column, data);
            return values.length > 0 ? values.reduce((a, b) => a + b, 0) : 0;
        }

        function getValidValues(column, data = filteredWeatherData) {
            return data
                .map(row => row[column])
                .filter(val => val !== null && val !== undefined && !isNaN(val));
        }

        // Chart Functions
        function createAllCharts() {
            showChartLoading(true);

            const chartsContainer = document.getElementById('charts');
            chartsContainer.innerHTML = '';

            if (charts && charts.length > 0) {
                charts.forEach(chart => {
                    if (chart.canvas) {
                        chart.canvas.remove();
                    }
                    chart.destroy();
                });
                charts = [];
            }

            try {
                const data = getFilteredData();

                Object.entries(chartGroups).forEach(([groupName, config]) => {
                    const availableColumns = config.columns.filter(col =>
                        data.some(row => row[col] !== null && row[col] !== undefined && !isNaN(row[col]))
                    );

                    if (availableColumns.length > 0) {
                        createChart(groupName, availableColumns, config, data);
                    }
                });

            } catch (error) {
                console.error('Error creating charts:', error);
                showError(`Error displaying charts: ${error.message}`);
            } finally {
                showChartLoading(false);
            }
        }

        function createChart(title, columns, config, data) {
            const chartContainer = document.createElement('div');
            chartContainer.className = 'chart-container';

            const chartTitle = document.createElement('h3');
            chartTitle.className = 'chart-title';
            chartTitle.textContent = title;

            const chartWrapper = document.createElement('div');
            chartWrapper.className = 'chart-wrapper';

            const canvas = document.createElement('canvas');
            chartWrapper.appendChild(canvas);

            chartContainer.appendChild(chartTitle);
            chartContainer.appendChild(chartWrapper);
            document.getElementById('charts').appendChild(chartContainer);

            const ctx = canvas.getContext('2d');

            const labels = data.map(row => {
                const date = new Date(row.date);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            });

            const datasets = columns.map((column, index) => ({
                label: formatColumnName(column),
                data: data.map(row => row[column]),
                borderColor: config.colors[index % config.colors.length],
                backgroundColor: config.type === 'bar' ?
                    config.colors[index % config.colors.length] + '80' :
                    config.colors[index % config.colors.length] + '20',
                borderWidth: 2,
                fill: config.type === 'line',
                tension: 0.1,
                pointRadius: config.type === 'line' ? 1 : 0,
                pointHoverRadius: 5
            }));

            const chartConfig = {
                type: config.type,
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function (context) {
                                    return `${context.dataset.label}: ${context.parsed.y?.toFixed(2) || 'N/A'} ${config.unit}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: 'Date/Time'
                            },
                            ticks: {
                                maxTicksLimit: 10,
                                callback: function (value, index, values) {
                                    if (values.length > 15 && index % Math.ceil(values.length / 8) !== 0) return '';
                                    return this.getLabelForValue(value);
                                }
                            }
                        },
                        y: {
                            display: true,
                            title: {
                                display: true,
                                text: config.unit
                            },
                            beginAtZero: config.type === 'bar'
                        }
                    },
                    interaction: {
                        mode: 'index',
                        intersect: false
                    }
                }
            };

            const chart = new Chart(ctx, chartConfig);
            charts.push(chart);
        }

        function formatColumnName(column) {
            return column
                .replace(/_/g, ' ')
                .replace(/\b\w/g, l => l.toUpperCase())
                .replace(/(\d+)m/g, ' ($1m)')
                .replace(/2m/g, '(2m)')
                .replace(/Msl/g, 'MSL')
                .replace('Apparent', 'Feels Like');
        }

        // News Functions
        async function fetchWeatherNews() {
            const city = document.getElementById('newsCity').value.trim();
            if (!city) {
                alert('Please enter a city name');
                return;
            }

            const newsResults = document.getElementById('newsResults');
            newsResults.innerHTML = '<p>Loading news...</p>';

            try {
                const response = await fetch(`/api/news?city=${encodeURIComponent(city)}`);
                if (!response.ok) {
                    throw new Error(`News API error: ${response.status}`);
                }

                const headlines = await response.json();
                displayNewsResults(headlines);
            } catch (error) {
                console.error('Error fetching news:', error);
                newsResults.innerHTML = `<p class="error-message">Failed to load news: ${error.message}</p>`;
            }
        }

        function displayNewsResults(articles) {
            const newsResults = document.getElementById('newsResults');

            if (!articles || articles.length === 0) {
                newsResults.innerHTML = '<p>No weather news found for this location.</p>';
                return;
            }

            newsResults.innerHTML = articles.map(article => `
                <div class="news-card">
                    <div class="news-source">
                        <span>${article.source}</span>
                        <span class="published-date">${article.publishedAt.slice(0, 10)}</span>
                    </div>
                    <h3><a href="${article.url}" target="_blank">${article.title}</a></h3>
                    <p class="news-description">${article.description}</p>
                    <a href="${article.url}" target="_blank" class="read-more">Read more →</a>
                </div>
            `).join('');
        }

        // Event Listeners
        document.getElementById('dateRange').addEventListener('change', () => {
            applyDateFilter();
            displayStats();
            createAllCharts();
        });

        document.getElementById('sampleRate').addEventListener('change', () => {
            displayStats();
            createAllCharts();
        });

        document.getElementById('newsBtn').addEventListener('click', () => {
            const modal = document.getElementById('newsModal');
            modal.style.display = 'block';

            // Pre-fill with current location if available
            if (userLocation) {
                // In a real app, you would reverse geocode to get city name
                document.getElementById('newsCity').placeholder = "Current Location (enter city name)";
            }
        });

        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('newsModal').style.display = 'none';
        });

        document.getElementById('searchNewsBtn').addEventListener('click', fetchWeatherNews);

        document.getElementById('refreshBtn').addEventListener('click', () => {
            showLoading(true, 'Refreshing data...');
            verifyLocationAccess().then(() => {
                window.location.reload();
            }).catch(error => {
                showError('Could not refresh: ' + error.message);
                showLoading(false);
            });
        });

        document.getElementById('signOutBtn').addEventListener('click', () => {
            showLoading(true, 'Signing out...');
            firebase.auth().signOut().then(() => {
                window.location.href = 'index.html';
            }).catch((error) => {
                console.error('Sign out error:', error);
                showError('Sign out failed. Please try again.');
                showLoading(false);
            });
        });

        // Close modal when clicking outside of it
        window.addEventListener('click', (event) => {
            const modal = document.getElementById('newsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
